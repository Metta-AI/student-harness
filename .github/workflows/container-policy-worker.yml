name: Container policy worker image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified image to GHCR (never deploys)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: container-policy-worker-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container-policy-worker/Dockerfile
          load: true
          tags: policy-worker-qualification:local
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Qualify isolated imports and graceful shutdown
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect policy-worker-qualification:local --format '{{.Id}}')
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          node tests/runtime/container-policy-image.mjs "$IMAGE_ID"
          printf 'image_id=%s\n' "$IMAGE_ID" >> "$GITHUB_OUTPUT"
          printf 'Qualified worker image: `%s` (publication requires publish=true).\n' "$IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact qualified image
        if: ${{ inputs.publish }}
        shell: bash
        env:
          QUALIFIED_IMAGE_ID: ${{ steps.qualify.outputs.image_id }}
          IMAGE_REPOSITORY: ghcr.io/metta-ai/student-harness-worker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$QUALIFIED_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect "$QUALIFIED_IMAGE_ID" --format '{{.Id}}')" == "$QUALIFIED_IMAGE_ID" ]]
          IMAGE_REFERENCE="$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker tag "$QUALIFIED_IMAGE_ID" "$IMAGE_REFERENCE"
          docker push "$IMAGE_REFERENCE"
          PUBLISHED_REFERENCE=$(docker image inspect "$IMAGE_REFERENCE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="$IMAGE_REPOSITORY@" 'index($0,prefix)==1 {print;exit}')
          [[ "$PUBLISHED_REFERENCE" =~ ^ghcr.io/metta-ai/student-harness-worker@sha256:[a-f0-9]{64}$ ]]
          printf 'Worker image: `%s` (qualified image ID `%s`).\n' "$PUBLISHED_REFERENCE" "$QUALIFIED_IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
# Qualification is the default. Optional publication tags the tested image ID;
# there is no second build, deployment, secret change, or ownership activation.
