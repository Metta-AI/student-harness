# Rendering and process activation are separate reviewed steps.
enabled: false
replicas: 0
image:
  repository: ghcr.io/metta-ai/student-harness-worker
  digest: ""
# Required if the published GHCR package is private. Preprovision separately.
imagePullSecrets: []
secretName: student-harness-container-worker
practiceEnabled: false
externalSecret:
  enabled: false
  storeName: aws-secretsmanager
  # A separately provisioned JSON object. Values never belong in this chart.
  remoteKey: ""
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
    ephemeral-storage: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
    ephemeral-storage: "6Gi"
nodeSelector:
  workload-type: prod-apps
tolerations:
  - key: workload-type
    value: prod-apps
    effect: NoSchedule
