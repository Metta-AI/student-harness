{{- if and .Values.enabled .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key := list "SUPABASE_URL" "SUPABASE_SERVICE_ROLE_KEY" "SESSION_SECRET" "POLICY_ARTIFACT_BUCKET" "VERCEL_TOKEN" "VERCEL_TEAM_ID" "VERCEL_PROJECT_ID" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required "externalSecret.remoteKey must name the provisioned worker secret" $.Values.externalSecret.remoteKey }}
        property: {{ $key }}
    {{- end }}
{{- end }}
